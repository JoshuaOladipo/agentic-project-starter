# CUSTOMIZE before autonomous development. This is declarative metadata;
# enforce dependency rules with stack-specific tooling and CI.
version: 1
project: "[PROJECT_NAME]"
status: uninitialized
principles:
  - Prefer simple, explicit solutions and existing dependencies.
  - Enforce authorization at the server boundary.
components: []
# Example after initialization:
# components:
#   - id: api
#     path: src/api
#     responsibility: Public HTTP boundary
#     owner: team-name
#     allowed_dependencies: [domain]
#     forbidden_dependencies: [infrastructure-internals]
protected_changes:
  - new-service
  - new-database-or-queue
  - authentication-or-authorization-design
  - public-api-breaking-change
  - cross-component-dependency
  - production-infrastructure
  - security-policy-or-agent-governance
  - irreversible-data-migration
